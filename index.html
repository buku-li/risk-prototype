  var frame = document.getElementById('frame');
  var crumb = document.getElementById('crumbName');
  var loading = document.getElementById('loading');
  var current = null;

  function b64ToUtf8(b64){
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  function show(name){
    if (!PAGES[name]) name = Object.keys(PAGES)[0];
    current = name;
    crumb.textContent = name;
    loading.style.display = 'flex';
    frame.srcdoc = b64ToUtf8(PAGES[name]);
    try { history.replaceState(null, '', '#' + encodeURIComponent(name)); } catch(e){}
  }
  function reloadTab(){ if (current) show(current); }

  // 页面内导航接管：iframe 里的侧边栏链接与 location.href 跳转，统一映射到内嵌页面
  var FILE2PAGE = {
    '内容审核工作台.html': '内容审核工作台',
    '内容审核任务-个人审核记录.html': '个人审核记录',
    '内容审核记录.html': '内容审核记录',
    '举报审核工作台.html': '举报审核工作台',
    '举报审核任务-个人记录.html': '个人记录',
    '举报记录.html': '举报记录'
  };
  function gotoFile(f){
    var name = FILE2PAGE[String(f).replace(/^.*\//, '')];
    if (name) show(name);
  }
  frame.addEventListener('load', function(){
    loading.style.display = 'none';
    var d = frame.contentDocument;
    if (!d) return;
    d.addEventListener('click', function(e){
      var t = e.target;
      if (!t || !t.closest) return;
      var a = t.closest('a[href]');
      if (a){
        var href = a.getAttribute('href') || '';
        if (/\.html(\?|#|$)/.test(href)){ e.preventDefault(); e.stopPropagation(); gotoFile(href); }
        return;
      }
      var el = t.closest('[onclick]');
      if (el){
        var m = (el.getAttribute('onclick') || '').match(/location\.href\s*=\s*['"]([^'"]+\.html)['"]/);
        if (m){ e.preventDefault(); e.stopPropagation(); gotoFile(m[1]); }
      }
    }, true);
  });

  var h = decodeURIComponent((location.hash || '').replace('#',''));
  show(PAGES[h] ? h : '内容审核工作台');
</script>
